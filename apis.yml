name: CareMerge
description: 'CareMerge is a senior living technology company that builds family engagement, care
  coordination, community engagement, and communications software for senior living and long-term /
  post-acute care communities. Its platform connects residents, families, and care staff so
  communities can coordinate care, share activities and calendars, and keep families informed. The
  company was surfaced as a portfolio company of Insight Partners and added to the API Evangelist
  network for enrichment. As of this pass CareMerge publishes no public developer API, developer
  portal, OpenAPI/AsyncAPI specification, or /.well-known discovery surface; its marketing site sits
  behind a SiteGround (sg-captcha) challenge and its GitHub organization contains internal tooling
  and open-source forks rather than a first-party client SDK.'
